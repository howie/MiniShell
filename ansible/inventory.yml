---
all:
  children:
    sandboxes:
      hosts:
        claw-agent:
          ansible_host: openshell-claw-agent
          ansible_user: sandbox
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
        claude-dev:
          ansible_host: openshell-claude-dev
          ansible_user: sandbox
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"

    localhost:
      hosts:
        mac-mini:
          ansible_connection: local
          ansible_host: localhost
