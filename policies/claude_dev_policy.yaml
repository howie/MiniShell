version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  claude_code:
    name: claude-code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: full
      - { host: mcp-proxy.anthropic.com, port: 443 }
      - { host: statsig.anthropic.com, port: 443 }
      - { host: sentry.io, port: 443 }
      - { host: raw.githubusercontent.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      - { host: gist.github.com, port: 443 }
      - { host: http-intake.logs.us5.datadoghq.com, port: 443 }
      - { host: platform.claude.com, port: 443 }
      - { host: auth.anthropic.com, port: 443 }
      - { host: console.anthropic.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: "/sandbox/.local/bin/claude" }
      - { path: "/sandbox/.local/share/claude/versions/**" }
      - { path: /usr/bin/node }

  claude_install:
    name: claude-install
    endpoints:
      - { host: claude.ai, port: 443 }
      - { host: downloads.claude.ai, port: 443 }
      - { host: storage.googleapis.com, port: 443 }
      - { host: github.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: "/sandbox/.local/bin/claude" }
      - { path: "/sandbox/.local/share/claude/versions/**" }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }

  claude_telemetry:
    name: claude-telemetry
    endpoints:
      - { host: statsigapi.net, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: "/sandbox/.local/bin/claude" }
      - { path: "/sandbox/.local/share/claude/versions/**" }
      - { path: /usr/bin/node }

  copilot:
    name: copilot
    endpoints:
      - { host: github.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: api.githubcopilot.com, port: 443 }
      - { host: api.enterprise.githubcopilot.com, port: 443 }
      - { host: release-assets.githubusercontent.com, port: 443 }
      - { host: copilot-proxy.githubusercontent.com, port: 443 }
      - { host: default.exp-tas.com, port: 443 }
    binaries:
      - { path: "/usr/lib/node_modules/@github/copilot/node_modules/@github/**/copilot" }

  cursor:
    name: cursor
    endpoints:
      - { host: cursor.blob.core.windows.net, port: 443 }
      - { host: api2.cursor.sh, port: 443 }
      - { host: repo.cursor.sh, port: 443 }
      - { host: download.cursor.sh, port: 443 }
      - { host: cursor.download.prss.microsoft.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
      - { path: "/sandbox/.cursor-server/**" }

  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: "/sandbox/.local/bin/claude" }
      - { path: "/sandbox/.local/share/claude/versions/**" }
      - { path: /usr/bin/gh }

  github_ssh_over_https:
    name: github-ssh-over-https
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**/info/refs*"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
          - allow:
              method: POST
              path: "/**/git-receive-pack"
    binaries:
      - { path: /usr/bin/git }

  npm_registry:
    name: npm-registry
    endpoints:
      - { host: registry.npmjs.org, port: 443 }
      - { host: registry.yarnpkg.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: "/sandbox/.local/bin/claude" }
      - { path: "/sandbox/.local/share/claude/versions/**" }
      - { path: /usr/bin/node }
      - { path: /usr/bin/npm }
      - { path: /usr/bin/npx }
      - { path: /usr/bin/yarn }

  nvidia_inference:
    name: nvidia-inference
    endpoints:
      - { host: integrate.api.nvidia.com, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /bin/bash }
      - { path: /usr/local/bin/opencode }

  opencode:
    name: opencode
    endpoints:
      - { host: registry.npmjs.org, port: 443 }
      - { host: opencode.ai, port: 443 }
      - { host: integrate.api.nvidia.com, port: 443 }
    binaries:
      - { path: "/usr/lib/node_modules/opencode-ai/bin/.opencode" }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/opencode }

  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      - { host: github.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: downloads.python.org, port: 443 }
    binaries:
      - { path: "/sandbox/.venv/bin/python" }
      - { path: "/sandbox/.venv/bin/python3" }
      - { path: "/sandbox/.venv/bin/pip" }
      - { path: "/app/.venv/bin/python" }
      - { path: "/app/.venv/bin/python3" }
      - { path: "/app/.venv/bin/pip" }
      - { path: /usr/local/bin/uv }
      - { path: "/sandbox/.uv/python/**" }

  vscode:
    name: vscode
    endpoints:
      - { host: update.code.visualstudio.com, port: 443 }
      - { host: az764295.vo.msecnd.net, port: 443 }
      - { host: vscode.download.prss.microsoft.com, port: 443 }
      - { host: marketplace.visualstudio.com, port: 443 }
      - { host: gallerycdn.vsassets.io, port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
      - { path: "/sandbox/.vscode-server/**" }
      - { path: "/sandbox/.vscode-remote-containers/**" }

  messaging_discord:
    name: messaging-discord
    endpoints:
      - { host: discord.com, port: 443 }
      - { host: gateway.discord.gg, port: 443 }
    binaries:
      - { path: /usr/bin/node }

  messaging_telegram:
    name: messaging-telegram
    endpoints:
      - { host: api.telegram.org, port: 443 }
    binaries:
      - { path: /usr/bin/node }

  messaging_slack:
    name: messaging-slack
    endpoints:
      - { host: slack.com, port: 443 }
      - { host: api.slack.com, port: 443 }
      - { host: wss-primary.slack.com, port: 443 }
    binaries:
      - { path: /usr/bin/node }
