version: 1

filesystem_policy:
  include_workdir: true
  read_write:
    - /sandbox
    - /tmp
    - /home/agent/.openclaw
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc

landlock:
  compatibility: best_effort

network_policies:
  google_ai:
    name: google_ai
    endpoints:
      - { host: generativelanguage.googleapis.com, port: 443 }
      - { host: aistudio.google.com, port: 443 }

  ollama_local:
    name: ollama_local
    endpoints:
      - { host: host.docker.internal, port: 11434 }
      - { host: host.openshell.internal, port: 11434 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  telegram:
    name: telegram
    endpoints:
      - { host: api.telegram.org, port: 443 }

  github:
    name: github
    endpoints:
      - { host: github.com, port: 443 }
      - { host: api.github.com, port: 443 }

  web_search:
    name: web_search
    endpoints:
      - { host: api.search.brave.com, port: 443 }

  npm_registry:
    name: npm_registry
    endpoints:
      - { host: registry.npmjs.org, port: 443 }

  discord:
    name: discord
    endpoints:
      - { host: discord.com, port: 443 }
      - { host: gateway.discord.gg, port: 443 }

  slack:
    name: slack
    endpoints:
      - { host: slack.com, port: 443 }
      - { host: wss-primary.slack.com, port: 443 }
