version: 1

filesystem_policy:
  include_workdir: true
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /home/agent/.openclaw
  read_only:
    - /app
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log

landlock:
  compatibility: best_effort

network_policies:
  google_ai:
    name: google_ai
    endpoints:
      - { host: generativelanguage.googleapis.com, port: 443 }
      - { host: aistudio.google.com, port: 443 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  ollama_local:
    name: ollama_local
    endpoints:
      - { host: host.docker.internal, port: 11434 }
      - { host: host.openshell.internal, port: 11434 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  acp_gateway:
    name: acp_gateway
    endpoints:
      - { host: host.docker.internal, port: 7865 }
      - { host: host.openshell.internal, port: 7865 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  telegram:
    name: telegram
    endpoints:
      - { host: api.telegram.org, port: 443 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  github:
    name: github
    endpoints:
      - { host: github.com, port: 443 }
      - { host: api.github.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      - { host: release-assets.githubusercontent.com, port: 443 }
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-https }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  web_search:
    name: web_search
    endpoints:
      - { host: api.search.brave.com, port: 443 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }

  npm_registry:
    name: npm_registry
    endpoints:
      - { host: registry.npmjs.org, port: 443 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/npm }

  discord:
    name: discord
    endpoints:
      - { host: discord.com, port: 443 }
      - { host: gateway.discord.gg, port: 443 }
    binaries:
      - { path: /usr/bin/node }

  slack:
    name: slack
    endpoints:
      - { host: slack.com, port: 443 }
      - { host: wss-primary.slack.com, port: 443 }
      - { host: wss-backup.slack.com, port: 443 }
    binaries:
      - { path: /usr/bin/node }

  line:
    name: line
    endpoints:
      - { host: api.line.me, port: 443 }
      - { host: api-data.line.me, port: 443 }
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
